services:
  - type: web
    name: cm-hash-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # SECRET — set the real value in the Render Dashboard (Environment tab).
      # Never commit credentials to this file.
      - key: DATABASE_URL
        sync: false
      # SECRET — set the real value in the Render Dashboard (Environment tab).
      # Generate with: openssl rand -base64 32
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: RENDER_FRONTEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

databases:
  - name: cmhash-db
    plan: free
    databaseName: cmhast