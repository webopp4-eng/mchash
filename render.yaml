services:
  - type: web
    name: cm-hash-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
        value: postgresql://cmhast_user:R3DvCyQyGFCzxiQI5z4i0VcQgNOb06RU@dpg-d9t7tdh42hec73fi3vtg-a.oregon-postgres.render.com/cmhast
      - key: JWT_SECRET
        sync: false
        value: cmhash-super-secret-key-2026-change-in-production-to-something-very-long-and-random
      - key: FRONTEND_URL
        sync: false
        value: https://mchash.vercel.app
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

databases:
  - name: cmhash-db
    plan: free
    databaseName: cmhast