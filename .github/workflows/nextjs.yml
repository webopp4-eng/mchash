name: Deploy Next.js app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          # All build-time configuration comes from GitHub Secrets (repo Settings
          # > Secrets and variables > Actions). Safe public-URL fallbacks keep the
          # site building even before secrets are configured. NO .env files are
          # committed or used — see the guard step below.
          NEXT_PUBLIC_API_URL: ${{ secrets['NEXT_PUBLIC_API_URL'] || 'https://mchash.onrender.com' }}
          NEXT_PUBLIC_RENDER_API_URL: ${{ secrets['NEXT_PUBLIC_RENDER_API_URL'] || 'https://mchash.onrender.com' }}
          NEXT_PUBLIC_ADMIN_API_URL: ${{ secrets['NEXT_PUBLIC_ADMIN_API_URL'] || 'https://mchash.onrender.com' }}
          NEXT_PUBLIC_DEPLOY_MODE: ${{ secrets['NEXT_PUBLIC_DEPLOY_MODE'] || 'github-pages' }}
          NEXT_PUBLIC_ADMIN_PANEL_LOCAL_ONLY: ${{ secrets['NEXT_PUBLIC_ADMIN_PANEL_LOCAL_ONLY'] || 'false' }}
          NEXT_PUBLIC_ALLOWED_ADMIN_ORIGIN: ${{ secrets['NEXT_PUBLIC_ALLOWED_ADMIN_ORIGIN'] || 'https://mchash.site' }}
          NEXT_PUBLIC_ADMIN_ORIGIN: ${{ secrets['NEXT_PUBLIC_ADMIN_ORIGIN'] || 'https://mchash.site' }}
          NEXT_PUBLIC_ADMIN_LOCAL_URL: ${{ secrets['NEXT_PUBLIC_ADMIN_LOCAL_URL'] || 'https://mchash.site' }}
          # Secret-only value: no fallback in the repo. Add it in repo Settings >
          # Secrets and variables > Actions to keep WalletConnect enabled.
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets['NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID'] }}

      - name: Guard — no .env files may exist (repo checkout or exported site)
        working-directory: frontend
        run: |
          set -e
          echo "Checking that no real .env files are present in the checkout..."
          LEAKS=$(find . -path ./node_modules -prune -o -type f \( -name '.env' -o -name '.env.*' -o -name '*.env' \) -print | grep -v '\.env\.example$' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Refusing to build: real .env file(s) found in repository:"; echo "$LEAKS"; exit 1
          fi
          echo "OK — no .env files in the checkout."
          # After the build, double-check the exported site ships no env files either.
          LEAKS_OUT=$(find out -type f \( -name '.env' -o -name '.env.*' -o -name '*.env' \) -print || true)
          if [ -n "$LEAKS_OUT" ]; then
            echo "::error::Refusing to deploy: .env file(s) found in the exported site:"; echo "$LEAKS_OUT"; exit 1
          fi
          echo "OK — exported site contains no .env files."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
